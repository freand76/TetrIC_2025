[package]
name = "tetric_emu"
version = "0.1.0"
edition = "2021"
description = "Emulator for the TetrIC ASIC (Tang Nano 20K version): CPU, video, sound, MOD player, gamepad"
license = "MIT"

[lib]
name = "tetric"
path = "src/lib.rs"

[[bin]]
name = "tetric_emu"
path = "src/main.rs"

[dependencies]
# X11 only: the native Wayland backend has no window decorations on GNOME
# (XWayland is used there)
minifb = { version = "0.28", default-features = false, features = ["x11"] }
cpal = "0.15"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 2
